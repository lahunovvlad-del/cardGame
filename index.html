<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lr9 №9</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="box">
        <div class="player">
            <h2 id="playerName">User</h2>
            <div class="score-badge" id="playerScore">0</div>
            <div class="card-slot">
                <img id="playerCardImg" src="Placeholder.png" alt="Player card">
            </div>
            <p id="playerCardName" class="card-name">Card: -</p>
        </div>

        <div class="center">
            <button id="btn">Generate</button>
            <p class="result-message" id="resultMessage"></p>
        </div>

        <div class="computer">
            <h2>Computer</h2>
            <div class="score-badge" id="aiScore">0</div>
            <div class="card-slot">
                <img id="aiCardImg" src="Placeholder.png" alt="AI cards">
            </div>
            <p id="aiCardName" class="card-name">Card: -</p>
        </div>
    </div>
</body>
</html>
